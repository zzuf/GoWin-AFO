name: Windows ABI oracle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abi-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  oracle:
    name: Native compiler ${{ matrix.label }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86
            goarch: "386"
            vcvars: amd64_x86
            execute: true
            expected: tools/abi-oracle/testdata/windows-sdk-10.0.26100-386.json
          - label: x64
            goarch: amd64
            vcvars: amd64
            execute: true
            expected: tools/abi-oracle/testdata/windows-sdk-10.0.26100-amd64.json
          - label: ARM64 cross-compile
            goarch: arm64
            vcvars: amd64
            execute: false
            expected: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test oracle generator and comparator
        run: go test ./tools/abi-oracle/...
      - name: Generate target probe
        shell: pwsh
        run: >-
          go run ./tools/abi-oracle generate
          --manifest tools/abi-oracle/testdata/probe-manifest.json
          --architecture ${{ matrix.goarch }}
          --out tools/abi-oracle/out/probe-${{ matrix.goarch }}.cpp
      - name: Compile with MSVC/clang-cl and Windows SDK 10.0.26100.0
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} 10.0.26100.0
          if errorlevel 1 exit /b 1
          if "${{ matrix.execute }}"=="true" (
            cl /nologo /std:c++17 /EHsc /W4 /WX /permissive- /utf-8 /Fe:tools\abi-oracle\out\probe-${{ matrix.goarch }}.exe tools\abi-oracle\out\probe-${{ matrix.goarch }}.cpp
            if errorlevel 1 exit /b 1
          ) else (
            rem The amd64 vcvars environment supplies SDK/STL headers; clang-cl's explicit target selects ARM64 without requiring the optional MSVC ARM64 compiler component.
            "%ProgramFiles%\LLVM\bin\clang-cl.exe" --target=arm64-pc-windows-msvc /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH /nologo /std:c++17 /EHsc /W4 /WX /permissive- /utf-8 /c /Fotools\abi-oracle\out\probe-${{ matrix.goarch }}.obj tools\abi-oracle\out\probe-${{ matrix.goarch }}.cpp
            if errorlevel 1 exit /b 1
          )
      - name: Execute probe
        if: matrix.execute
        shell: cmd
        run: tools\abi-oracle\out\probe-${{ matrix.goarch }}.exe > tools\abi-oracle\out\actual-${{ matrix.goarch }}.json
      - name: Compare executed C++ result with checked-in baseline
        if: matrix.execute
        shell: pwsh
        run: >-
          go run ./tools/abi-oracle compare
          --expected ${{ matrix.expected }}
          --actual tools/abi-oracle/out/actual-${{ matrix.goarch }}.json
          --out tools/abi-oracle/out/diff-${{ matrix.goarch }}.json
      - name: Verify checked-in ABI evidence against normalized Go IR
        if: matrix.goarch == 'amd64' || matrix.goarch == 'arm64'
        run: go run ./cmd/winapiverify abi --all --output coverage/abi-${{ matrix.goarch }}.json
      - name: Record ARM64 execution limitation
        if: matrix.execute == false
        shell: pwsh
        run: |
          "ARM64 probe compiled successfully with clang-cl. It was not executed on the x64 hosted runner, so no ARM64 runtime-verification claim is made." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload ABI evidence and mismatch report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: abi-${{ matrix.goarch }}
          path: |
            tools/abi-oracle/out/
            coverage/abi-${{ matrix.goarch }}.json
          if-no-files-found: error
          retention-days: 14
